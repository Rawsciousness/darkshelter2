  <script type="module">
    // Resolve the latest asset versions on every page load. No background polling.
    const fallback = {"version": "89ed291168c8", "assets": {"styles.css": "styles.css?v=f3078530f979", "studio-config.js": "studio-config.js?v=3e5e9b84826b", "app.js": "app.js?v=0016eea1a952"}};
    const manifestUrl = new URL('version.json', location.href);
    manifestUrl.search = '';
    manifestUrl.hash = '';
    async function latest() {
      const response = await fetch(manifestUrl, {cache: 'no-store'});
      if (!response.ok) throw new Error('Version manifest unavailable');
      const value = await response.json();
      if (!value.version || !value.assets) throw new Error('Invalid version manifest');
      for (const key of ['styles.css', 'studio-config.js', 'app.js']) {
        const url = new URL(value.assets[key], manifestUrl);
        if (url.origin !== location.origin || url.pathname !== new URL(key, manifestUrl).pathname) throw new Error('Invalid asset URL');
      }
      return value;
    }
    let current;
    try { current = await latest(); } catch { current = fallback; }
    document.getElementById('studio-styles').href = current.assets['styles.css'];
    for (const name of ['studio-config.js', 'app.js']) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = current.assets[name];
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    let lastCheck = Date.now();
    let checking = false;
    async function checkForUpdate(force = false) {
      if (document.hidden || checking || (!force && Date.now() - lastCheck < 15000)) return;
      checking = true;
      lastCheck = Date.now();
      try {
        const next = await latest();
        if (next.version !== current.version) {
          const url = new URL(location.href);
          url.searchParams.set('v', next.version);
          location.replace(url.href);
        }
      } catch {} finally { checking = false; }
    }
    addEventListener('focus', () => checkForUpdate());
    addEventListener('visibilitychange', () => checkForUpdate());
    addEventListener('pageshow', event => { if (event.persisted) checkForUpdate(true); });
    addEventListener('online', () => checkForUpdate(true));
  </script>
